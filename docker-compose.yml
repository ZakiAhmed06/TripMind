version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: tripmind-postgres
    restart: always
    environment:
      POSTGRES_USER: tripmind
      POSTGRES_PASSWORD: tripmind123
      POSTGRES_DB: tripmind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripmind -d tripmind_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tripmind-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://tripmind:tripmind123@db:5432/tripmind_db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - SECRET_KEY=${SECRET_KEY:-tripmind-docker-secret-2026}
      - FRONTEND_URL=http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tripmind-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
